<html>

<head>
    <title>Game Loop</title>
    <style>
        *{
            margin:0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <canvas id="canv">

    </canvas>
    <script src="Vector2.js"></script>
    <script>
        let canvas = document.querySelector("#canv")
        let ctx = canvas.getContext("2d")

        let position = new Vector2(50, 100)

        function gameLoop(){
            update()
            draw()
            requestAnimationFrame(gameLoop)
        }

        function update(){
            position.x += 2
            position.y += .5
        }

        function draw() {
            //expand canvas size
            canvas.width = window.innerWidth
            canvas.height = window.innerHeight

            //signalling to context that drawing will happen
            ctx.save()

            //tell browser where center of object is
            ctx.translate(position.x, position.y)

            ctx.lineTo(0, -30)
            ctx.lineTo(10, 0)
            ctx.lineTo(40, 0)
            ctx.lineTo(15, 20)
            ctx.lineTo(25, 50)
            ctx.lineTo(0, 30)
            ctx.lineTo(-25, 50)
            ctx.lineTo(-15, 20)
            ctx.lineTo(-40, 0)
            ctx.lineTo(-10, 0)

            ctx.fillStyle = "gold"
            ctx.fill()

            //signalling that drawing is over
            ctx.restore()
        }

        requestAnimationFrame(gameLoop)
    </script>
</body>

</html>
