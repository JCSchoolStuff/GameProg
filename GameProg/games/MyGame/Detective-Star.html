    <title>Detective Star</title>
    <style>
        * {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <canvas id="canv">

    </canvas>
    <script src="../../engine/Vector2.js"></script>
    <script src="../../engine/Input.js"></script>
    <script src="../../engine/Engine.js"></script>
    <script src="../../engine/Component.js"></script>
    <script src="../../engine/GameObject.js"></script>
    <script src="../../engine/Scene.js"></script>
    <script src="../../engine/SceneManager.js"></script>
    <script src="../../engine/Time.js"></script>
    <script src="../../engine/Collisions.js"></script>

    <script src="../../engine/Components/Transform.js"></script>
    <script src="../../engine/Components/Polygon.js"></script>
    <script src="../../engine/Components/TextLabel.js"></script>
    <script src="../../engine/Components/MultiLineTextLabel.js"></script>
    <script src="../../engine/Components/Camera.js"></script>
    <script src="../../engine/Components/Collider.js"></script>
    <script src="../../engine/Components/RigidBody.js"></script>

    <script src="./components/UpdateComponent.js"></script>
    <script src="./components/DialogueHandler.js"></script>
    <script src="./components/LevelController.js"></script>

    <script src="./gameObjects/MainGameObject.js"></script>
    <script src="./gameObjects/GohnGameObject.js"></script>
    <script src="./gameObjects/EquityGameObject.js"></script>
    <script src="./gameObjects/HexGameObject.js"></script>
    <script src="./gameObjects/UlyssesGameObject.js"></script>
    <script src="./gameObjects/VictimGameObject.js"></script>
    <script src="./gameObjects/DialogueBoxGameObject.js"></script>
    <script src="./gameObjects/DialogueGameObject.js"></script>
    <script src="./gameObjects/TitleBackgroundGameObject.js"></script>
    <script src="./gameObjects/TitleTextGameObject.js"></script>
    <script src="./gameObjects/TitleButtonGameObject.js"></script>
    <script src="./gameObjects/LevelControllerGameObject.js"></script>
    <script src="./gameObjects/WallGameObject.js"></script>
    <script src="./gameObjects/ShortWallGameObject.js"></script>
    <script src="./gameObjects/DoorWallGameObject.js"></script>
    <script src="./gameObjects/DetectorGameObject.js"></script>
    <script src="./gameObjects/DoorGameObject.js"></script>
    <script src="./gameObjects/FountainGameObject.js"></script>

    <script src="./scenes/TitleScene.js"></script>
    <script src="./scenes/InvestigateScene.js"></script>
    <script src="./scenes/GenericScene.js"></script>

    <script src="./Assets.js"></script>
    <script src="./Globals.js"></script>
    <script src="./Settings.js"></script>

    <script>
        //start the game engine
        Engine.start(TitleScene, Settings)

        //collision tests
        let one = new GameObject()
        one.addComponent(new Polygon(), {points:[
            new Vector2(0,-1),
            new Vector2(-1,1),
            new Vector2(1,1)
        ]})

        let two = new GameObject()
        two.addComponent(new Polygon(), {points:[
            new Vector2(0,-1),
            new Vector2(-1,1),
            new Vector2(1,1)
        ]})

        console.assert(Collisions.isCollisionPointPolygon(new Vector2(0,0), one))
        console.assert(Collisions.isCollisionPointPolygon(new Vector2(0,.9999), one))

        console.assert(!Collisions.isCollisionPointPolygon(new Vector2(10000,10000), one))
        console.assert(!Collisions.isCollisionPointPolygon(new Vector2(0,-1.1), one))
        console.assert(!Collisions.isCollisionPointPolygon(new Vector2(0,-1.0001), one))

        console.assert(Collisions.isCollisionPolygonPolygon(one, two))
        two.transform.position = new Vector2(1000,400)
        console.assert(!Collisions.isCollisionPolygonPolygon(one, two))
    </script>
</body>

</html>
