<html>
    <head>
        <title>Game Loop</title>
    </head>
    <body>
        <canvas id="canv">
            
        </canvas>
        <script>
            let canvas = document.querySelector("#canv")
            let ctx = canvas.getContext("2d")

            //expand canvas size
            canvas.width = window.innerWidth
            canvas.height = window.innerHeight

            //signalling to context that drawing will happen
            ctx.save()
            
            //tell browser where center of object is
            ctx.translate(50,75)

            ctx.lineTo(0,-30)
            ctx.lineTo(10,0)
            ctx.lineTo(40,0)
            ctx.lineTo(15,20)
            ctx.lineTo(25,50)
            ctx.lineTo(0,30)
            ctx.lineTo(-25,50)
            ctx.lineTo(-15,20)
            ctx.lineTo(-40,0)
            ctx.lineTo(-10,0)

            ctx.fillStyle = "gold"
            ctx.fill()

            //signalling that drawing is over
            ctx.restore()
        </script>
    </body>
</html>
