<html>

<head>
    <title>Space Shooter!</title>
    <style>
        * {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <canvas id="canv">

    </canvas>
    <script src="../engine/Vector2.js"></script>
    <script src="../engine/Input.js"></script>
    <script src="../engine/Engine.js"></script>
    <script>
        let position = new Vector2(50, 100)

        function update() {
            if (Input.keysDown.includes("ArrowRight"))
                position.x += 1
            if (Input.keysDown.includes("ArrowLeft"))
                position.x -= 1
            if (Input.keysDown.includes("ArrowUp"))
                position.y -= 1
            if (Input.keysDown.includes("ArrowDown"))
                position.y += 1
        }

        function draw(ctx) {
            //signalling to context that drawing will happen
            ctx.save()

            //tell browser where center of object is
            ctx.translate(position.x, position.y)

            ctx.lineTo(0, -30)
            ctx.lineTo(10, 0)
            ctx.lineTo(40, 0)
            ctx.lineTo(15, 20)
            ctx.lineTo(25, 50)
            ctx.lineTo(0, 30)
            ctx.lineTo(-25, 50)
            ctx.lineTo(-15, 20)
            ctx.lineTo(-40, 0)
            ctx.lineTo(-10, 0)

            ctx.fillStyle = "gold"
            ctx.fill()

            //signalling that drawing is over
            ctx.restore()
        }

        Engine.start()

    </script>
</body>

</html>
